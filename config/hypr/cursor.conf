# ┌──────────────────────────────────────────────────────────┐
# │                  Cursor Configuration                    │
# └──────────────────────────────────────────────────────────┘

cursor {
    no_hardware_cursors = false       # Set true if cursor is invisible/glitchy (NVIDIA)
    inactive_timeout = 5              # Seconds before cursor hides on inactive window (0 = never)
    no_warps = false                  # Don't warp cursor to focused window
    default_monitor =                 # Monitor to use for cursor if not on any (empty = auto)
    enable_hyprcursor = true          # Enable Hyprcursor support for higher quality cursors
    hide_on_key_press = false         # Hide cursor when typing
    hide_on_touch = true              # Hide cursor on touch input
}
