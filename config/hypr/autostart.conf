# ┌──────────────────────────────────────────────────────────┐
# │                  Autostart Configuration                 │
# └──────────────────────────────────────────────────────────┘

# ── XDG Desktop Portal (CRITICAL for screen sharing) ─────
exec-once = sleep 1 && dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = sleep 1 && systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = sleep 2 && /usr/lib/xdg-desktop-portal-hyprland &
exec-once = sleep 2 && /usr/lib/xdg-desktop-portal &

# ── Cursor Theme ─────────────────────────────────────────
exec-once = hyprctl setcursor Bibata-Modern-Ice 24
exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'Bibata-Modern-Ice'
exec-once = gsettings set org.gnome.desktop.interface cursor-size 24

# ── GTK Theme Settings ──────────────────────────────────
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'Catppuccin-Mocha-Standard-Mauve-Dark'
exec-once = gsettings set org.gnome.desktop.interface icon-theme 'Papirus-Dark'
exec-once = gsettings set org.gnome.desktop.interface font-name 'Fira Sans 11'
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'

# ── Core Components ──────────────────────────────────────
exec-once = waybar
exec-once = dunst
exec-once = hypridle

# ── Wallpaper ────────────────────────────────────────────
exec-once = hyprpaper

# ── Clipboard History ────────────────────────────────────
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# ── System Tray Applets ─────────────────────────────────
exec-once = nm-applet --indicator
# exec-once = blueman-applet                    # Uncomment if you use Bluetooth

# ── Authentication Agent ─────────────────────────────────
# CachyOS ships with polkit-kde-agent. If you use a different one, adjust the path.
exec-once = /usr/lib/polkit-kde-authentication-agent-1 || /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# ── Misc ─────────────────────────────────────────────────
# exec-once = swayosd-server                    # Uncomment for on-screen volume/brightness display
# exec-once = udiskie --automount --tray        # Uncomment for auto-mounting USB drives
