# ┌──────────────────────────────────────────────────────────┐
# │             Hyprlock — Lock Screen Configuration         │
# │                  Catppuccin Mocha Theme                  │
# └──────────────────────────────────────────────────────────┘

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 5                     # Seconds of grace period before locking (password not needed)
    no_fade_in = false
    no_fade_out = false
}

# ── Background ───────────────────────────────────────────
background {
    monitor =
    path = screenshot              # Use screenshot of current screen
    blur_passes = 4
    blur_size = 8
    noise = 0.02
    contrast = 0.9
    brightness = 0.7
    vibrancy = 0.2
    vibrancy_darkness = 0.0
}

# ── Time ─────────────────────────────────────────────────
label {
    monitor =
    text = $TIME
    color = rgb(205, 214, 244)     # Text
    font_size = 90
    font_family = Fira Sans Bold
    position = 0, 200
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgb(0, 0, 0)
    shadow_boost = 0.5
}

# ── Date ─────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:3600000] echo "$(date +'%A, %B %d %Y')"
    color = rgb(186, 194, 222)     # Subtext1
    font_size = 22
    font_family = Fira Sans
    position = 0, 120
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgb(0, 0, 0)
}

# ── Greeting ─────────────────────────────────────────────
label {
    monitor =
    text = Hello, Harry 👋
    color = rgb(203, 166, 247)     # Mauve
    font_size = 18
    font_family = Fira Sans
    position = 0, 40
    halign = center
    valign = center
}

# ── Input Field ──────────────────────────────────────────
input-field {
    monitor =
    size = 300, 55
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1             # -1 = circle
    outer_color = rgb(203, 166, 247)    # Mauve
    inner_color = rgb(30, 30, 46)       # Base
    font_color = rgb(205, 214, 244)     # Text
    fade_on_empty = false
    fade_timeout = 1000
    placeholder_text = <span foreground="##a6adc8">  Enter Password...</span>
    hide_input = false
    rounding = 12
    check_color = rgb(166, 227, 161)    # Green — correct
    fail_color = rgb(243, 139, 168)     # Red — wrong
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_timeout = 2000
    fail_transition = 300
    capslock_color = rgb(249, 226, 175) # Yellow — caps lock on
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    position = 0, -50
    halign = center
    valign = center
}

# ── Lock Icon / Status ───────────────────────────────────
label {
    monitor =
    text = 󰌾
    color = rgb(166, 173, 200)     # Subtext0
    font_size = 24
    font_family = MesloLGS Nerd Font
    position = 0, -130
    halign = center
    valign = center
}
