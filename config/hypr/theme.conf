# ┌──────────────────────────────────────────────────────────┐
# │           Theme — Catppuccin Mocha Inspired              │
# └──────────────────────────────────────────────────────────┘

# ── General ──────────────────────────────────────────────
general {
    gaps_in = 4
    gaps_out = 12
    border_size = 2

    # Active border: Mauve → Lavender gradient
    col.active_border = rgba(cba6f7ff) rgba(b4befeff) 45deg
    # Inactive border: Surface0
    col.inactive_border = rgba(313244aa)

    resize_on_border = true
    extend_border_grab_area = 15
    hover_icon_on_border = true
    allow_tearing = false
    layout = dwindle
}

# ── Decoration ───────────────────────────────────────────
decoration {
    rounding = 12

    active_opacity = 1.0
    inactive_opacity = 0.92
    fullscreen_opacity = 1.0

    dim_inactive = false
    dim_strength = 0.15

    blur {
        enabled = true
        size = 8
        passes = 3
        noise = 0.02
        contrast = 0.9
        brightness = 0.8
        vibrancy = 0.17
        vibrancy_darkness = 0.0
        new_optimizations = true
        xray = false               # true = see through floating windows to wallpaper
        special = false            # Apply blur to special workspace
        popups = true              # Blur popups (menus, tooltips)
    }

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(11111bee)      # Crust
        color_inactive = rgba(11111b88)
        offset = 0 2
        scale = 1.0
    }
}

# ── Animations ───────────────────────────────────────────
animations {
    enabled = true
    first_launch_animation = true

    # Custom bezier curves
    bezier = easeOutExpo, 0.16, 1, 0.3, 1
    bezier = easeInOutCubic, 0.65, 0, 0.35, 1
    bezier = easeOutBack, 0.34, 1.56, 0.64, 1
    bezier = easeOutQuint, 0.22, 1, 0.36, 1
    bezier = linear, 0, 0, 1, 1
    bezier = easeInOutSine, 0.37, 0, 0.63, 1

    # Window animations
    animation = windows, 1, 5, easeOutBack, slide
    animation = windowsIn, 1, 5, easeOutBack, slide
    animation = windowsOut, 1, 4, easeOutExpo, popin 80%
    animation = windowsMove, 1, 4, easeOutQuint

    # Fade
    animation = fade, 1, 5, easeOutExpo
    animation = fadeIn, 1, 4, easeOutExpo
    animation = fadeOut, 1, 4, easeOutExpo
    animation = fadeSwitch, 1, 6, easeOutExpo
    animation = fadeDim, 1, 6, easeOutExpo

    # Border
    animation = border, 1, 10, easeOutExpo
    animation = borderangle, 1, 100, linear, loop    # Rotating gradient border

    # Workspaces
    animation = workspaces, 1, 5, easeOutExpo, slide
    animation = specialWorkspace, 1, 5, easeOutBack, slidevert

    # Layers (waybar, rofi, notifications)
    animation = layers, 1, 4, easeOutQuint, fade
    animation = fadeLayers, 1, 4, easeOutExpo
}

# ── Layout: Dwindle ──────────────────────────────────────
dwindle {
    preserve_split = true
    smart_split = false
    smart_resizing = true
    force_split = 0                # 0 = follow mouse, 1 = always left/top, 2 = always right/bottom
    special_scale_factor = 0.8     # Scale of windows on special workspace
    no_gaps_when_only = 0          # 0 = always gaps, 1 = no gaps single window, 2 = no gaps + no border
}

# ── Layout: Master (alternative, change layout in general{}) ─
master {
    new_status = master
    orientation = left
    mfact = 0.55                   # Master window size ratio
    special_scale_factor = 0.8
    no_gaps_when_only = 0
}

# ── Tab Groups ───────────────────────────────────────────
group {
    insert_after_current = true
    focus_removed_window = true

    col.border_active = rgba(cba6f7ff)     # Mauve
    col.border_inactive = rgba(313244aa)   # Surface0
    col.border_locked_active = rgba(f9e2afff)  # Yellow
    col.border_locked_inactive = rgba(313244aa)

    groupbar {
        enabled = true
        height = 14
        font_size = 10
        render_titles = true
        scrolling = true
        text_color = rgb(205, 214, 244)    # Text
        col.active = rgba(cba6f7ff)        # Mauve
        col.inactive = rgba(313244aa)      # Surface0
        col.locked_active = rgba(f9e2afff) # Yellow
        col.locked_inactive = rgba(313244aa)
    }
}

# ── Binds Behavior ───────────────────────────────────────
binds {
    workspace_back_and_forth = true        # Pressing current workspace number toggles back
    allow_workspace_cycles = true          # Workspace previous cycles through history
    scroll_event_delay = 300               # ms between scroll events
    movefocus_cycles_fullscreen = false
}

# ── Miscellaneous ────────────────────────────────────────
misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true                     # Variable frame rate (saves power)
    vrr = 0                        # Variable refresh rate: 0=off, 1=on, 2=fullscreen only
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    new_window_takes_over_fullscreen = 2   # 0=behind, 1=takes over, 2=unfullscreen
    focus_on_activate = false      # Don't steal focus from other windows
    mouse_move_enables_dpms = true # Move mouse to wake screen
    key_press_enables_dpms = true  # Press key to wake screen
    allow_session_lock_restore = true
    initial_workspace_tracking = 1 # Track initial workspace
}

# ── XWayland ─────────────────────────────────────────────
xwayland {
    force_zero_scaling = true      # Fixes blurry XWayland apps on scaled displays
}
