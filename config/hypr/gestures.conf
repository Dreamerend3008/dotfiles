# ┌──────────────────────────────────────────────────────────┐
# │                  Gesture Configuration                   │
# └──────────────────────────────────────────────────────────┘

gestures {
    workspace_swipe = true               # Enable 3-finger workspace swipe
    workspace_swipe_fingers = 3          # Number of fingers for swipe
    workspace_swipe_distance = 300       # Distance in px for full swipe
    workspace_swipe_invert = true        # Invert swipe direction (natural)
    workspace_swipe_min_speed_to_force = 30   # Minimum speed to force workspace change
    workspace_swipe_cancel_ratio = 0.5   # How far you need to swipe to commit (0.0-1.0)
    workspace_swipe_create_new = true    # Create new workspace if swiping past last
    workspace_swipe_direction_lock = true     # Lock to horizontal/vertical
    workspace_swipe_direction_lock_threshold = 10  # px before direction locks
    workspace_swipe_forever = false      # Keep swiping through all workspaces
    workspace_swipe_use_r = false        # Use 'r' prefix for relative workspace switching
}
