# Preload wallpapers
# preload = /home/harry/Pictures/Wallpapers/your_wallpaper.jpg
# Replace the line below with the path to your actual wallpaper once you add it
image = math.png

preload = /home/harry/dotfiles/utils/wallpapers/image

# Set wallpapers to monitors using modern hyprlang block syntax
wallpaper {
    monitor = 
    path = /home/harry/dotfiles/utils/wallpapers/image
}

# Disable the splash text that hyprpaper puts on the screen by default
splash = false
