# Preload wallpapers
# preload = ~/Pictures/Wallpapers/your_wallpaper.jpg
# Replace the line below with the path to your actual wallpaper once you add it
preload = ~/.config/hypr/wallpaper.jpg

# Set wallpapers to monitors
# To set it for a specific monitor, put the monitor name before the comma, like: DP-1,~/Pictures/Wallpapers/...
# The empty space before the comma means "all monitors"
# wallpaper = ,~/Pictures/Wallpapers/your_wallpaper.jpg
# Replace the line below as well!
wallpaper = ,~/.config/hypr/wallpaper.jpg

# Disable the splash text that hyprpaper puts on the screen by default
splash = false
