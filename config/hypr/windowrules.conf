# Picture-in-Picture
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = pin, title:^(Picture-in-Picture)$
windowrulev2 = size 420 236, title:^(Picture-in-Picture)$
windowrulev2 = move 100%-440 50, title:^(Picture-in-Picture)$
windowrulev2 = nodim, title:^(Picture-in-Picture)$
windowrulev2 = opacity 1.0 override 1.0 override, title:^(Picture-in-Picture)$

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# XWayland Video Bridge (screen sharing in Discord/Zoom/Teams)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
windowrulev2 = opacity 0.0 override, class:^(xwaylandvideobridge)$
windowrulev2 = noanim, class:^(xwaylandvideobridge)$
windowrulev2 = noinitialfocus, class:^(xwaylandvideobridge)$
windowrulev2 = maxsize 1 1, class:^(xwaylandvideobridge)$
windowrulev2 = noblur, class:^(xwaylandvideobridge)$

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Opacity Rules
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
windowrulev2 = opacity 0.90 0.85, class:^(firefox)$
windowrulev2 = opacity 0.95 0.90, class:^(ghostty)$
windowrulev2 = opacity 0.95 0.90, class:^(kitty)$
windowrulev2 = opacity 0.95 0.90, class:^(Alacritty)$
windowrulev2 = opacity 0.90 0.85, class:^(code-oss)$
windowrulev2 = opacity 0.90 0.85, class:^(Code)$
windowrulev2 = opacity 0.90 0.85, class:^(code-url-handler)$
windowrulev2 = opacity 0.85 0.80, class:^(discord)$
windowrulev2 = opacity 0.90 0.85, class:^(Spotify)$
windowrulev2 = opacity 0.90 0.85, class:^(spotify)$
windowrulev2 = opacity 0.85 0.80, class:^(Steam)$
windowrulev2 = opacity 0.90 0.85, class:^(thunar)$
windowrulev2 = opacity 0.90 0.85, class:^(org.gnome.Nautilus)$
# Full opacity for image/video viewers
windowrulev2 = opacity 1.0 override 1.0 override, class:^(mpv)$
windowrulev2 = opacity 1.0 override 1.0 override, class:^(imv)$
windowrulev2 = opacity 1.0 override 1.0 override, class:^(org.gnome.Loupe)$
windowrulev2 = opacity 1.0 override 1.0 override, title:^(.*YouTube.*)$

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Idle Inhibit — Prevent screen lock during fullscreen video
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
windowrulev2 = idleinhibit fullscreen, class:^(firefox)$
windowrulev2 = idleinhibit fullscreen, class:^(mpv)$
windowrulev2 = idleinhibit fullscreen, class:^(vlc)$
windowrulev2 = idleinhibit focus, class:^(mpv)$

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Workspace Assignments
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# windowrulev2 = workspace 1, class:^(firefox)$          # Uncomment to pin browser to WS1
# windowrulev2 = workspace 2, class:^(ghostty)$          # Uncomment to pin terminal to WS2
# windowrulev2 = workspace 3, class:^(Code)$             # Uncomment to pin VS Code to WS3
# windowrulev2 = workspace 4, class:^(discord)$          # Uncomment to pin Discord to WS4
# windowrulev2 = workspace 5, class:^(Spotify)$          # Uncomment to pin Spotify to WS5
# windowrulev2 = workspace 9 silent, class:^(Steam)$     # Uncomment to send Steam to WS9

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
