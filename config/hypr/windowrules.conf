# ┌──────────────────────────────────────────────────────────┐
# │               Window Rules Configuration                 │
# └──────────────────────────────────────────────────────────┘

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Float — Dialogs, Pickers, Popups
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
windowrule = float 1, match:title ^(Open File)$
windowrule = float 1, match:title ^(Save File)$
windowrule = float 1, match:title ^(Open Folder)$
windowrule = float 1, match:title ^(Save As)$
windowrule = float 1, match:title ^(Confirm to replace files)$
windowrule = float 1, match:title ^(File Operation Progress)$
windowrule = float 1, match:title ^(Volume Control)$
windowrule = float 1, match:title ^(About)(.*)$
windowrule = float 1, match:title ^(Properties)$
windowrule = float 1, match:class ^(pavucontrol)$
windowrule = float 1, match:class ^(nm-connection-editor)$
windowrule = float 1, match:class ^(blueman-manager)$
windowrule = float 1, match:class ^(polkit-kde-authentication-agent-1)$
windowrule = float 1, match:class ^(polkit-gnome-authentication-agent-1)$
windowrule = float 1, match:class ^(org.kde.polkit-kde-authentication-agent-1)$
windowrule = float 1, match:class ^(xdg-desktop-portal-gtk)$
windowrule = float 1, match:class ^(zenity)$
windowrule = float 1, match:class ^(file-roller)$
windowrule = float 1, match:class ^(nwg-look)$
windowrule = float 1, match:class ^(qt5ct)$
windowrule = float 1, match:class ^(qt6ct)$

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Float — System Utilities
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
windowrule = float 1, match:class ^(org.gnome.Calculator)$
windowrule = float 1, match:class ^(gnome-calculator)$
windowrule = float 1, match:class ^(org.gnome.Settings)$
windowrule = float 1, match:class ^(org.gnome.SystemMonitor)$
windowrule = float 1, match:class ^(org.kde.ark)$
windowrule = float 1, match:class ^(org.freedesktop.impl.portal.desktop.kde)$
windowrule = float 1, match:class ^(org.freedesktop.impl.portal.desktop.gtk)$
windowrule = float 1, match:class ^(waypaper)$

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Float — File Managers
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
windowrule = float 1, match:class ^(thunar)$ match:title ^(File Operation Progress)$
windowrule = float 1, match:class ^(thunar)$ match:title ^(Confirm to replace files)$
windowrule = float 1, match:class ^(org.gnome.Nautilus)$ match:title ^(Properties)$

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Picture-in-Picture
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
windowrule = float 1, match:title ^(Picture-in-Picture)$
windowrule = pin 1, match:title ^(Picture-in-Picture)$
windowrule = size 420 236, match:title ^(Picture-in-Picture)$
windowrule = move 100%-440 50, match:title ^(Picture-in-Picture)$
windowrule = no_dim 1, match:title ^(Picture-in-Picture)$
windowrule = opacity 1.0 override 1.0 override, match:title ^(Picture-in-Picture)$

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# XWayland Video Bridge (screen sharing in Discord/Zoom/Teams)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
windowrule = opacity 0.0 override, match:class ^(xwaylandvideobridge)$
windowrule = no_anim 1, match:class ^(xwaylandvideobridge)$
windowrule = no_initial_focus 1, match:class ^(xwaylandvideobridge)$
windowrule = max_size 1 1, match:class ^(xwaylandvideobridge)$
windowrule = no_blur 1, match:class ^(xwaylandvideobridge)$

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Opacity Rules
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
windowrule = opacity 0.90 0.85, match:class ^(firefox)$
windowrule = opacity 0.95 0.90, match:class ^(ghostty)$
windowrule = opacity 0.95 0.90, match:class ^(kitty)$
windowrule = opacity 0.95 0.90, match:class ^(Alacritty)$
windowrule = opacity 0.90 0.85, match:class ^(code-oss)$
windowrule = opacity 0.90 0.85, match:class ^(Code)$
windowrule = opacity 0.90 0.85, match:class ^(code-url-handler)$
windowrule = opacity 0.85 0.80, match:class ^(discord)$
windowrule = opacity 0.90 0.85, match:class ^(Spotify)$
windowrule = opacity 0.90 0.85, match:class ^(spotify)$
windowrule = opacity 0.85 0.80, match:class ^(Steam)$
windowrule = opacity 0.90 0.85, match:class ^(thunar)$
windowrule = opacity 0.90 0.85, match:class ^(org.gnome.Nautilus)$
# Full opacity for image/video viewers
windowrule = opacity 1.0 override 1.0 override, match:class ^(mpv)$
windowrule = opacity 1.0 override 1.0 override, match:class ^(imv)$
windowrule = opacity 1.0 override 1.0 override, match:class ^(org.gnome.Loupe)$
windowrule = opacity 1.0 override 1.0 override, match:title ^(.*YouTube.*)$

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Idle Inhibit — Prevent screen lock during fullscreen video
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
windowrule = idle_inhibit fullscreen, match:class ^(firefox)$
windowrule = idle_inhibit fullscreen, match:class ^(mpv)$
windowrule = idle_inhibit fullscreen, match:class ^(vlc)$
windowrule = idle_inhibit focus, match:class ^(mpv)$

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Workspace Assignments
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# windowrule = workspace 1, match:class ^(firefox)$          # Uncomment to pin browser to WS1
# windowrule = workspace 2, match:class ^(ghostty)$          # Uncomment to pin terminal to WS2
# windowrule = workspace 3, match:class ^(Code)$             # Uncomment to pin VS Code to WS3
# windowrule = workspace 4, match:class ^(discord)$          # Uncomment to pin Discord to WS4
# windowrule = workspace 5, match:class ^(Spotify)$          # Uncomment to pin Spotify to WS5
# windowrule = workspace 9 silent, match:class ^(Steam)$     # Uncomment to send Steam to WS9

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# App-specific Fixes
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Steam
windowrule = float 1, match:class ^(Steam)$ match:title ^(Friends List)$
windowrule = float 1, match:class ^(Steam)$ match:title ^(Steam Settings)$
windowrule = float 1, match:class ^(Steam)$ match:title ^(Steam - News)$
windowrule = float 1, match:class ^(Steam)$ match:title ^(Screenshot Manager)$

# Wlogout
windowrule = float 1, match:class ^(wlogout)$
windowrule = fullscreen 1, match:class ^(wlogout)$

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Layer Rules — Blur (Glassmorphism)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
layerrule = blur 1, match:namespace ^(rofi)$
layerrule = blur 1, match:namespace ^(waybar)$
layerrule = blur 1, match:namespace ^(dunst)$
layerrule = blur 1, match:namespace ^(logout_dialog)$
layerrule = ignore_alpha 0.0, match:namespace ^(rofi)$
layerrule = ignore_alpha 0.0, match:namespace ^(waybar)$
layerrule = ignore_alpha 0.0, match:namespace ^(dunst)$
layerrule = ignore_alpha 0.0, match:namespace ^(logout_dialog)$
layerrule = ignore_alpha 0.5, match:namespace ^(waybar)$
