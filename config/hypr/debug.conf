# ┌──────────────────────────────────────────────────────────┐
# │              Debug & Performance Configuration           │
# └──────────────────────────────────────────────────────────┘

debug {
    disable_logs = true              # Set false to enable logging (~/.local/share/hyprland/)
    disable_time = true              # Don't prepend timestamps to logs
    enable_stdout_logs = false       # Set true to also print logs to stdout
    damage_tracking = 2              # 2 = full (best performance), 1 = monitor, 0 = none
    vfr = true                       # Variable frame rate (saves power)
    colored_stdout_logs = true       # Colorize stdout logs

    # ── Performance Tips (comments) ──────────────────────
    # If experiencing lag/stuttering:
    #   1. Reduce blur passes in theme.conf (3 → 1)
    #   2. Disable blur: decoration:blur:enabled = false
    #   3. Reduce shadow range in theme.conf
    #   4. Set damage_tracking = 2 (should already be default)
    #   5. For NVIDIA: set cursor:no_hardware_cursors = true
    #
    # To debug crashes:
    #   1. Set disable_logs = false
    #   2. Reproduce the issue
    #   3. Check: cat /tmp/hypr/$(ls -t /tmp/hypr/ | head -1)/hyprland.log
}
