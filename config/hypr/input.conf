# ┌──────────────────────────────────────────────────────────┐
# │                    Input Configuration                   │
# └──────────────────────────────────────────────────────────┘

input {
    # ── Keyboard ──────────────────────────────────────────
    kb_layout = us
    # kb_variant =
    # kb_model =
    # kb_options = caps:escape    # Uncomment to map Caps Lock → Escape
    # kb_rules =

    kb_options = compose:ralt     # Right Alt as Compose key (for accents: ñ, é, etc.)
    numlock_by_default = true
    repeat_rate = 50              # Key repeat speed (chars/sec)
    repeat_delay = 300            # Delay before repeat starts (ms)

    # ── Mouse ─────────────────────────────────────────────
    sensitivity = 0               # -1.0 to 1.0, 0 = no modification
    accel_profile = flat          # flat = no acceleration (gaming), adaptive = default
    force_no_accel = false
    left_handed = false
    scroll_method = 2fg           # 2fg = two-finger, edge, on_button_down, no_scroll
    scroll_button = 0             # Button for on_button_down method (0 = disabled)
    natural_scroll = false        # For mouse: false = traditional

    follow_mouse = 1              # 0=click, 1=follow, 2=follow+click, 3=follow+click+release
    mouse_refocus = true          # Refocus on mouse enter

    # ── Touchpad ──────────────────────────────────────────
    touchpad {
        natural_scroll = true         # Touchpad: true = macOS-style (recommended)
        disable_while_typing = true   # Disable touchpad while typing
        tap-to-click = true           # Tap = click
        drag_lock = false             # Lift finger without ending drag
        tap-and-drag = true           # Tap and hold to drag
        scroll_factor = 1.0           # Scroll speed multiplier
        middle_button_emulation = false
        clickfinger_behavior = false  # false = button areas, true = finger count
    }
}

# ── Per-device Overrides (examples) ──────────────────────
# Uncomment and adjust for your specific devices.
# Find device names with: hyprctl devices
#
# device {
#     name = epic-mouse-v1
#     sensitivity = -0.5
#     accel_profile = adaptive
# }
#
# device {
#     name = your-external-keyboard
#     kb_layout = us
#     repeat_rate = 60
# }
